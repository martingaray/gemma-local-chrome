<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemma Local Chrome</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <button id="menu-btn" class="icon-btn" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
      </svg>
    </button>
    <h1 data-i18n="appTitle">Gemma Local Chrome</h1>
    <span id="local-badge" class="badge">100% local</span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="lang-en" class="lang-btn" title="English">🇺🇸</button>
      <button id="lang-es" class="lang-btn" title="Español">🇦🇷</button>
    </div>
  </header>

  <nav id="drawer" class="drawer" hidden>
    <a id="help-link" href="https://github.com/martingaray/gemma-local-chrome/blob/main/docs/HELP.md" target="_blank" rel="noopener" data-i18n="help">Help</a>
    <a href="settings.html" data-i18n="settings">Settings</a>
    <a href="https://www.martingaray.com.ar/?utm_source=chrome-extensions&utm_medium=gemma-local-chrome" target="_blank" rel="noopener" data-i18n="website">Author's website</a>
    <a href="https://github.com/martingaray/gemma-local-chrome?utm_source=chrome-extensions&utm_medium=gemma-local-chrome&utm_content=demo" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <main id="chat" class="chat" aria-live="polite"></main>

  <section class="composer">
    <div id="status" class="status" hidden></div>
    <progress id="progress" max="1" value="0" hidden></progress>
    <details id="log-box" hidden>
      <summary data-i18n="logLabel">Processing log</summary>
      <pre id="log"></pre>
    </details>
    <div class="composer-meta">
      <label class="check">
        <input id="include-page" type="checkbox" checked />
        <span data-i18n="includePage">Include the current page as context</span>
      </label>
      <select id="model-select" data-i18n-title="model" hidden></select>
      <span id="ctx-donut" data-i18n-title="contextUsed"></span>
    </div>
    <textarea id="input" rows="2" data-i18n-ph="composerPlaceholder"
      placeholder="Ask Gemma"></textarea>
    <div class="btn-row">
      <button id="send-btn" data-i18n="send">Send</button>
      <button id="new-chat-btn" class="secondary icon-round" data-i18n-title="resetChat" aria-label="Clear and restart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 8 16 8"/>
        </svg>
      </button>
    </div>
  </section>

  <footer class="app-footer">
    <a href="https://www.martingaray.com.ar/?utm_source=chrome-extensions&utm_medium=gemma-local-chrome" target="_blank" rel="noopener">martingaray.com.ar</a>
    <span>© 2026 · <a href="https://opensource.org/licenses/MIT?utm_source=chrome-extensions&utm_medium=gemma-local-chrome" target="_blank" rel="noopener" data-i18n="footerLicense">MIT License</a></span>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
