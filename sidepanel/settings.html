<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Gemma Local Chrome</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <a href="sidepanel.html" class="icon-btn" title="Back" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 data-i18n="personalization">Personalization</h1>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="lang-en" class="lang-btn" title="English">🇺🇸</button>
      <button id="lang-es" class="lang-btn" title="Español">🇦🇷</button>
    </div>
  </header>

  <main>
    <section class="controls settings">
      <div class="setting-row">
        <div>
          <label for="style" data-i18n="baseStyle">Base style and tone</label>
          <p class="setting-hint" data-i18n="baseStyleHint">How Gemma responds to you. This doesn't change what it can do.</p>
        </div>
        <select id="style"></select>
      </div>

      <h2 data-i18n="characteristics">Characteristics</h2>
      <div class="setting-row">
        <label for="warm" data-i18n="warm">Warm</label>
        <select id="warm"></select>
      </div>
      <div class="setting-row">
        <label for="enthusiastic" data-i18n="enthusiastic">Enthusiastic</label>
        <select id="enthusiastic"></select>
      </div>
      <div class="setting-row">
        <label for="emoji" data-i18n="emoji">Emoji</label>
        <select id="emoji"></select>
      </div>
      <div class="setting-row">
        <label for="lists" data-i18n="lists">Headers &amp; lists</label>
        <select id="lists"></select>
      </div>

      <h2 data-i18n="customInstructions">Custom instructions</h2>
      <textarea id="custom" rows="4" data-i18n-ph="customPh"
        placeholder="e.g. Act as a digital marketing expert. Always give one concrete example."></textarea>

      <div class="btn-row">
        <button id="save-btn" data-i18n="save">Save</button>
      </div>
      <div id="status" class="status" hidden></div>
    </section>
  </main>

  <footer class="app-footer">
    <a href="https://www.martingaray.com.ar/?utm_source=chrome-extensions&utm_medium=gemma-local-chrome" target="_blank" rel="noopener">martingaray.com.ar</a>
    <span>© 2026 · <a href="https://opensource.org/licenses/MIT?utm_source=chrome-extensions&utm_medium=gemma-local-chrome" target="_blank" rel="noopener" data-i18n="footerLicense">MIT License</a></span>
  </footer>

  <script type="module" src="settings.js"></script>
</body>
</html>
